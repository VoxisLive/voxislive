name: Release hygiene

# Enforces the public allowlist on every push / PR: only the explicitly named
# files may be tracked here, and no live secrets may enter this repository.
# See scripts/check_release_hygiene.py.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so the --history scan is meaningful
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scan tracked tree and history for leaks
        run: python scripts/check_release_hygiene.py --history
