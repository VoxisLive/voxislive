name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install locked runtime and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest==9.1.1 pytest-cov==7.1.0 ruff==0.15.22 pyright==1.1.411

      - name: Run tests with coverage
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

      - name: Check localization parity
        run: python scripts/check_i18n.py

      - name: Run static analysis
        run: ruff check app tests scripts

      - name: Run type checker
        run: pyright

      - name: Compile Python sources
        run: python -m compileall -q app main.py scripts

  build:
    name: Windows frozen-build smoke test
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime and build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pyinstaller==6.21.0

      - name: Seed build configuration
        shell: pwsh
        run: Copy-Item config.example.json config.json

      - name: Build frozen application
        run: python app/build_official.py

      - name: Verify frozen artifact
        shell: pwsh
        run: |
          if (-not (Test-Path dist/VoxisLive/VoxisLive.exe)) {
            throw "VoxisLive.exe was not produced"
          }
          if (-not (Test-Path dist/VoxisLive/_internal/BUILD_VERSION)) {
            throw "BUILD_VERSION stamp is missing"
          }

  test-linux:
    name: Linux sysaudio port
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # app/sysaudio's is_supported() checks for these on PATH; installing
      # them lets the dispatch tests exercise the real "supported" branch
      # instead of only the shutil.which-mocked one.
      - name: Install PipeWire/PulseAudio CLI tools (pactl, parec)
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio-utils

      # Not requirements.lock: it pins Windows-only packages (pywin32,
      # comtypes, pycaw, pyaudiowpatch) unconditionally, and most of the
      # suite transitively imports Windows-only modules (e.g. win_audio's
      # `from ctypes.wintypes import ...`) at collection time. Only
      # app/sysaudio and its Linux backend are OS-dispatched cleanly enough
      # to import and test on Linux today.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1 numpy==2.4.6

      - name: Run Linux sysaudio tests
        run: >
          python -m pytest -q
          tests/test_sysaudio.py
          tests/test_sysaudio_linux_capture.py
          tests/test_sysaudio_linux_routing.py
          tests/test_sysaudio_linux_virtual_mic.py

  flutter:
    name: Flutter client analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/flutter
    steps:
      - uses: actions/checkout@v7

      # No third-party Action: this org's Actions policy (see decision-log
      # ADR #36) only allows github_owned/verified Actions, and the Flutter
      # Marketplace action isn't one. The SDK is a plain git checkout of its
      # own release tag -- shell steps, not an Action, so the policy stays
      # untouched. Pinned to the same 3.22.0 the prior action used.
      - name: Install Flutter SDK
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.22.0 --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
